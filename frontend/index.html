<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finova — Smart Banking. Smarter Future.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('finova-theme');
          var theme = saved || 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark' || theme === 'night') {
            document.documentElement.classList.add('dark');
            if (theme === 'night') document.documentElement.classList.add('night');
          } else {
            document.documentElement.classList.remove('dark', 'night');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
